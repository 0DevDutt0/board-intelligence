# /home/claude/board-intelligence/docker-compose.yml
# Board Intelligence System - Docker Compose
# Requires: Docker 29+, NVIDIA Container Toolkit, WSL2 2.7.0+, CUDA driver 592+

name: board-intelligence

services:

  # ── vLLM: LLM inference server ────────────────────────────────────────────
  vllm:
    image: board-intelligence/vllm:cuda128
    build:
      context: .
      dockerfile: Dockerfile.vllm
    container_name: bis-vllm
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      # Disable flashinfer's JIT sampling module -- its check_cuda_arch() rejects
      # sm_120 (RTX 5090 Blackwell) in the installed flashinfer-python version.
      # The flashinfer attention backend (AttentionBackendEnum.FLASHINFER) works
      # fine; only the topk_topp sampler uses JIT compilation that fails.
      - VLLM_USE_FLASHINFER_SAMPLER=0
      # Tell flashinfer JIT to compile for Blackwell (sm_120) if it does run.
      - FLASHINFER_CUDA_ARCHS=12.0
    volumes:
      - ./models:/models:ro
    command: >
      python -m vllm.entrypoints.openai.api_server
      --model /models/Qwen3-14B-AWQ
      --quantization awq_marlin
      --dtype float16
      --gpu-memory-utilization 0.60
      --max-model-len 8192
      --max-num-batched-tokens 8192
      --port 11436
      --host 0.0.0.0
      --served-model-name qwen3-14b
      --attention-backend flashinfer
      --no-enable-log-requests
    ports:
      - "127.0.0.1:11436:11436"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11436/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Backend: FastAPI application ──────────────────────────────────────────
  backend:
    image: board-intelligence/backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: bis-backend
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - VLLM_BASE_URL=http://vllm:11436
      - VLLM_MODEL=qwen3-14b
      - EMBEDDING_MODEL=/models/bge-m3
      - RERANKER_MODEL=/models/bge-reranker-v2-m3
      - NLI_MODEL=/models/nli-deberta-v3-small
      - DEVICE=cuda
      - LOG_LEVEL=INFO
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-change-me-in-production}
      - MAX_UPLOAD_MB=100
    volumes:
      - ./models:/models:ro
      - ./src:/app/src:ro
      - /tmp/bis-sessions:/tmp/bis-sessions
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      uvicorn src.api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --log-level info
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Frontend: React dev server (replace with nginx for production) ─────────
  frontend:
    image: board-intelligence/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: bis-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE=http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  bis-sessions:

networks:
  default:
    name: bis-network
    driver: bridge
    internal: false
